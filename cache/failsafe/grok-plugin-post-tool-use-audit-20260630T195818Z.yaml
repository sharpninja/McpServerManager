method: workflow.triage.report
label: grok-plugin-post-tool-use-audit
timestamp: 2026-07-01T00:58:18.5729461Z
params:
  title: 'Audit: post_tool_use hook implementation issues in grok plugin'
  summary: The PostToolUse hook handling in the McpServer Grok plugin has several bugs causing 'post_tool_use hook error' during tool executions, especially code edits and plan operations in refactoring workflows.
  observed_behavior: When PostToolUse events fire (e.g. after Write/Edit tools or ExitPlanMode), hooks either skip unexpectedly, output inconsistent JSON formats, fail parsing, or trigger host-reported hook errors. code-verify and plan hooks are partial. Deprecated methods used.
  expected_behavior: All PostToolUse matchers should execute cleanly, output standardized hookSpecificOutput JSON, handle varied tool inputs gracefully, use non-deprecated client APIs, and not cause hook errors in the host.
  severity: high
  component: grok-plugin
  workspace_path: F:\GitHub\McpServerManager
  dedupe_key: grok-plugin-post-tool-use-audit-2026-07
  affected_paths:
  - hooks/hooks.json
  - lib/plugin-hook.ps1
  - hooks/scripts/code-verify.ps1
  - hooks/scripts/plan-approved.ps1
  - hooks/scripts/plan-modified.ps1
  - hooks/scripts/*.ps1
  evidence: Inspection of hooks.json shows limited matchers only for ExitPlanMode and Write|Edit. plugin-hook.ps1 ValidateSet and switch lack general post tool use. code-verify outputs flat {status} while others use hookSpecificOutput. Get-HookPayloadValue and Get-PlanFilePathFromInput use brittle json access. Some REPL calls use deprecated workflow.* . code-verify walks for .csproj and runs dotnet without robust error handling for hook context.
  reproduction_hints: Perform code edits or plan approvals in Grok with the plugin active. Observe post_tool_use hook errors in logs or host UI. Trigger code-verify via Write/Edit on .cs files.
  tags:
  - hook
  - post_tool_use
  - grok-plugin
  - audit
  - refactoring
  reporter_agent: GrokCode
  session_id: GrokCode-20260701T003806Z-fdc8
  turn_id: req-20260701T003806Z-fdc8
  recommended_fixes:
  - 1. Update hooks.json PostToolUse to include a default/catch-all matcher that calls a new general post-tool-use.ps1 script which dispatches based on tool name and always outputs correct hookSpecificOutput format.
  - "2. Standardize all PostToolUse handlers (including code-verify) to output the hookSpecificOutput wrapper with 'hookEventName': 'PostToolUse' and status."
  - '3. Improve Get-HookPayloadValue and Get-PlanFilePathFromInput to try more paths: tool_input, input, args, tool_use.input.file_path etc. Add fallback logging.'
  - 4. In plugin-hook.ps1, add support for a 'post-tool-use' HookName in ValidateSet and switch that can be a no-op or router.
  - 5. Update all Invoke-PluginRepl calls from 'workflow.*' to equivalent 'client.*' methods (e.g. client.Todo.* , client.SessionLog.*) to remove deprecation warnings.
  - '6. Make code-verify more defensive: handle cases with no project gracefully, capture build errors better, ensure JSON is always written even on exception (wrap in try/finally).'
  - 7. Add unit tests for the hook functions with mocked inputs.
  - 8. Update the plugin-hook.ps1 to handle errors in individual Invoke-* functions without crashing the whole hook.

