<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>McpServer Web</title>
    <base href="/" />
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background: #ffffff;
        }

        .hybrid-splash {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            color: #1f2328;
            background: #ffffff;
        }

        .hybrid-splash__panel {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            align-items: center;
            gap: 16px;
            max-width: 440px;
        }

        .hybrid-splash__mark {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #ffffff;
            background: #24292f;
            font-size: 24px;
            font-weight: 700;
        }

        .hybrid-splash__title {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.25;
        }

        .hybrid-splash__status {
            margin: 4px 0 0;
            color: #656d76;
            font-size: 14px;
            line-height: 1.4;
        }

        #blazor-error-ui {
            display: none;
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1000;
            max-width: min(560px, calc(100vw - 32px));
            padding: 12px 16px;
            color: #1f2328;
            background: #fff8c5;
            border: 1px solid #d4a72c;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
        }

        #blazor-error-ui .reload {
            margin-left: 8px;
        }

        #blazor-error-ui .dismiss {
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/%40primer/css%4021.0.8/dist/primer.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app">
        <div class="hybrid-splash" role="status" aria-live="polite">
            <div class="hybrid-splash__panel">
                <div class="hybrid-splash__mark" aria-hidden="true">M</div>
                <div>
                    <h1 class="hybrid-splash__title">McpServer</h1>
                    <p class="hybrid-splash__status">Starting MCP Web...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/sse.js"></script>
    <script src="js/appShell.js"></script>
    <script src="js/agentChatFlyout.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
